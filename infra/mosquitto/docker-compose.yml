services:
  mosquitto:
    image: iegomez/mosquitto-go-auth:3.0.0-mosquitto_2.0.18
    container_name: fuel-carrier-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/etc/mosquitto/mosquitto.conf:ro
      - ./config/secrets/postgres.conf:/etc/mosquitto/secrets/postgres.conf:ro
      - mosquitto-data:/var/lib/mosquitto
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat /etc/mosquitto/mosquitto.conf /etc/mosquitto/secrets/postgres.conf > /tmp/mosquitto.conf
        exec /usr/bin/tini -- /usr/sbin/mosquitto -c /tmp/mosquitto.conf
    restart: "no"

volumes:
  mosquitto-data:
