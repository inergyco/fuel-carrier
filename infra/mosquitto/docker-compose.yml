services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: fuel-carrier-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    restart: "no"

volumes:
  mosquitto-data:
  mosquitto-log:
