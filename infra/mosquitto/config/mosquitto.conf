# Local Mosquitto + mosquitto-go-auth (Postgres).
# Image mounts config at /etc/mosquitto — see iegomez/mosquitto-go-auth docs.
# Plugin path inside the image: /mosquitto/go-auth.so
#
# Secrets (password, and optionally pg_host) are appended at container start from
# config/secrets/postgres.conf (gitignored). See postgres.conf.example.

listener 1883
protocol mqtt
allow_anonymous false

persistence true
persistence_location /var/lib/mosquitto/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

auth_plugin /mosquitto/go-auth.so
auth_opt_backends postgres
auth_opt_hasher bcrypt
auth_opt_log_level info

auth_opt_pg_port 5432
auth_opt_pg_dbname fuel_carrier
auth_opt_pg_user fuel_carrier_mqtt
auth_opt_pg_sslmode disable
auth_opt_pg_connect_tries 5

# $1 = username. Return bcrypt hash only when the client is enabled.
auth_opt_pg_userquery SELECT password_hash FROM mqtt_clients WHERE username = $1 AND enabled = true LIMIT 1

# $1 = username. Count > 0 → superuser (broad access). Prefer ACLs for devices.
auth_opt_pg_superquery SELECT count(*) FROM mqtt_clients WHERE username = $1 AND is_superuser = true AND enabled = true

# $1 = username, $2 = requested access (1=read, 2=write, 4=subscribe).
auth_opt_pg_aclquery SELECT a.topic FROM mqtt_acls a INNER JOIN mqtt_clients c ON c.id = a.client_id WHERE c.username = $1 AND c.enabled = true AND (($2 = 1 AND a.access IN ('read', 'readwrite')) OR ($2 = 2 AND a.access IN ('write', 'readwrite')) OR ($2 = 4 AND a.access IN ('read', 'readwrite')))
