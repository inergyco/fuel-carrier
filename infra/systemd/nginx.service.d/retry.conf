# Drop-in for the packaged nginx unit.
# Start limits belong in [Unit]. In [Service], systemd ignores
# StartLimitIntervalSec and a failed start is retried forever.
#
# Unattended upgrades restart nginx while packages are still unpacking.
# The startup config test can fail for that moment, and the stock unit
# does not retry, so the site stays down. This retries every 15s for
# 5 minutes, then stops.

[Unit]
StartLimitIntervalSec=300
StartLimitBurst=20

[Service]
Restart=on-failure
RestartSec=15s
