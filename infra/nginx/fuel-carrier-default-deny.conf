# Drop requests that don't match a known server_name (IP hits, random Host headers).
# Install:
#   sudo cp infra/nginx/fuel-carrier-default-deny.conf /etc/nginx/sites-available/fuel-carrier-default-deny
#   sudo ln -sf /etc/nginx/sites-available/fuel-carrier-default-deny /etc/nginx/sites-enabled/
# Needs the panel cert lineage so HTTPS default_server can handshake then close.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/mobile-fueling.inergy.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mobile-fueling.inergy.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 444;
}
