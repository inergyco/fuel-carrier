# Shared API upstream for panel vhosts.
# Install:
#   sudo cp infra/nginx/fuel-carrier-api-upstream.conf \
#     /etc/nginx/conf.d/fuel-carrier-api-upstream.conf
# Production instances listen on 127.0.0.1:3010 and :3011
# (Uptime Kuma already owns :3001 on the current VPS).

upstream fuel_carrier_api {
    least_conn;
    server 127.0.0.1:3010;
    server 127.0.0.1:3011;
}
