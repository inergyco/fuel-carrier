# External (company) panel — mobile-fueling.inergy.ir
# Install:
#   sudo cp infra/nginx/fuel-carrier-external.conf /etc/nginx/sites-available/fuel-carrier-external
#   sudo ln -sf /etc/nginx/sites-available/fuel-carrier-external /etc/nginx/sites-enabled/
# Certs: certbot --nginx -d mobile-fueling.inergy.ir -d mobile-fueling-admin.inergy.ir
# (both panel vhosts share the mobile-fueling.inergy.ir lineage)

server {
    listen 80;
    listen [::]:80;
    server_name mobile-fueling.inergy.ir;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mobile-fueling.inergy.ir;

    ssl_certificate /etc/letsencrypt/live/mobile-fueling.inergy.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mobile-fueling.inergy.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/fuel-carrier/external-panel;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
