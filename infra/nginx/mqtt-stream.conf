# TLS passthrough for Mosquitto — only allow SNI mqtt.inergy.ir.
# Install on VPS:
#   sudo mkdir -p /etc/nginx/streams-enabled
#   sudo cp infra/nginx/mqtt-stream.conf /etc/nginx/streams-enabled/mqtt.conf
# Add to /etc/nginx/nginx.conf (top level, outside http {}):
#   stream {
#       include /etc/nginx/streams-enabled/*.conf;
#   }

map $ssl_preread_server_name $mqtt_upstream {
    mqtt.inergy.ir mqtt_backend;
    default         mqtt_drop;
}

upstream mqtt_backend {
    server 127.0.0.1:8883;
}

upstream mqtt_drop {
    server 127.0.0.1:9;
}

server {
    listen 8883;
    listen [::]:8883;
    ssl_preread on;
    proxy_pass $mqtt_upstream;
    proxy_connect_timeout 5s;
}
