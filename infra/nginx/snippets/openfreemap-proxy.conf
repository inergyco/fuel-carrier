# OpenFreeMap reverse proxy (same-origin `/ofm/` for MapLibre + CSP).
# Install on the VPS:
#   sudo cp infra/nginx/snippets/openfreemap-proxy.conf \
#     /etc/nginx/snippets/fuel-carrier-openfreemap-proxy.conf
# Include inside each panel HTTPS server block (before `location /`).
#
# Style JSON from OpenFreeMap contains absolute `https://tiles.openfreemap.org/...`
# URLs. Rewrite them to this host so glyphs/tiles stay same-origin under CSP
# `connect-src 'self'` / `font-src 'self'`. Requires ngx_http_sub_module.

location /ofm/ {
    proxy_pass https://tiles.openfreemap.org/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host tiles.openfreemap.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # sub_filter cannot rewrite gzip bodies from upstream.
    proxy_set_header Accept-Encoding "";

    sub_filter_once off;
    sub_filter_types application/json;
    sub_filter "https://tiles.openfreemap.org/" "https://$host/ofm/";
}
