# Shared SPA browser-hardening headers (SEC-05).
# Install on the VPS:
#   sudo cp infra/nginx/snippets/spa-security-headers.conf \
#     /etc/nginx/snippets/fuel-carrier-spa-security-headers.conf
# Include inside each panel `location /` block (not `/api/` — API uses Helmet).

# Force HTTPS for a year (and subdomains); eligible for browser preload lists.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Block clickjacking (legacy header + CSP frame-ancestors below).
add_header X-Frame-Options "DENY" always;

# Do not MIME-sniff responses as a different type.
add_header X-Content-Type-Options "nosniff" always;

# Avoid leaking path/query via Referer.
add_header Referrer-Policy "no-referrer" always;

# SPA CSP: same-origin app + API/WS; inline theme bootstrap in index.html;
# external https: images for company logos. frame-ancestors none = no iframes.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'" always;
