# Shared SPA browser-hardening headers (SEC-05).
# Install on the VPS:
#   sudo cp infra/nginx/snippets/spa-security-headers.conf \
#     /etc/nginx/snippets/fuel-carrier-spa-security-headers.conf
# Include inside each panel `location /` block (not `/api/` — API uses Helmet).

# Force HTTPS for a year (and subdomains); eligible for browser preload lists.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Block clickjacking (legacy header + CSP frame-ancestors below).
add_header X-Frame-Options "DENY" always;

# Do not MIME-sniff responses as a different type.
add_header X-Content-Type-Options "nosniff" always;

# Avoid leaking path/query via Referer.
add_header Referrer-Policy "no-referrer" always;

# SPA CSP. Theme bootstrap is /theme-init.js, so script-src is 'self' only.
# style-src-elem blocks <style> tags. style-src-attr keeps 'unsafe-inline'
# for dynamic style attributes (map markers, chart colors, bar widths).
# Browsers that ignore style-src-attr fall back to style-src.
# External https: images for company logos. frame-ancestors none = no iframes.
# worker-src covers the PWA service worker; script-src remains the fallback.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; worker-src 'self'; style-src 'self'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; manifest-src 'self'" always;
